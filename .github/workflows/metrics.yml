name: Profile Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "23 0 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml
      - scripts/publish-metrics.mjs

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Metrics credential
        id: credential
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        shell: bash
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Add a scope-less classic PAT as METRICS_TOKEN to enable profile rendering." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out profile
        if: steps.credential.outputs.configured == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Render light profile
        if: steps.credential.outputs.configured == 'true'
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # stable 3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: 1nuoiscute
          filename: metrics-light.svg
          output_action: none
          base: ""
          template: classic
          config_timezone: Asia/Shanghai
          config_order: isocalendar, followup
          config_animations: no
          config_padding: 0, 12
          config_display: regular
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_followup: yes
          plugin_followup_sections: user
          plugin_followup_indepth: no
          plugin_followup_archived: yes
          plugins_errors_fatal: yes
          retries: 2
          retries_delay: 10
          notice_releases: no
          extras_js: |
            for (const heading of document.querySelectorAll('h2')) {
              if (heading.textContent.includes('Contributions calendar')) {
                const statistics = heading.closest('section').querySelector('.row');
                if (statistics) statistics.remove();
                const calendar = heading.closest('section').querySelector('svg[style]');
                if (calendar) calendar.style.marginTop = '0';
              }
            }
          extras_css: |
            svg { color: #59636e; }
            h1, h2, h3 { color: #0969da; }
            .activity .details, .activity .timestamp, footer { color: #59636e; }
            .activity .repo, .activity .issue { color: #0969da; }

      - name: Render dark profile
        if: steps.credential.outputs.configured == 'true'
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # stable 3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: 1nuoiscute
          filename: metrics-dark.svg
          output_action: none
          base: ""
          template: classic
          config_timezone: Asia/Shanghai
          config_order: isocalendar, followup
          config_animations: no
          config_padding: 0, 12
          config_display: regular
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_followup: yes
          plugin_followup_sections: user
          plugin_followup_indepth: no
          plugin_followup_archived: yes
          plugins_errors_fatal: yes
          retries: 2
          retries_delay: 10
          notice_releases: no
          extras_js: |
            for (const heading of document.querySelectorAll('h2')) {
              if (heading.textContent.includes('Contributions calendar')) {
                const statistics = heading.closest('section').querySelector('.row');
                if (statistics) statistics.remove();
                const calendar = heading.closest('section').querySelector('svg[style]');
                if (calendar) calendar.style.marginTop = '0';
              }
            }
          extras_css: |
            svg { color: #c9d1d9; }
            h1, h2, h3 { color: #58a6ff; }
            .activity .details, .activity .timestamp, footer { color: #9da7b3; }
            .activity .repo, .activity .issue { color: #58a6ff; }
            :root {
              --color-calendar-graph-day-bg: #161b22;
              --color-calendar-graph-day-border: rgba(255,255,255,.08);
              --color-calendar-graph-day-L1-bg: #0e4429;
              --color-calendar-graph-day-L2-bg: #006d32;
              --color-calendar-graph-day-L3-bg: #26a641;
              --color-calendar-graph-day-L4-bg: #39d353;
            }

      - name: Publish verified renders
        if: steps.credential.outputs.configured == 'true'
        shell: bash
        run: |
          node scripts/publish-metrics.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/metrics-light.svg assets/metrics-dark.svg README.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: refresh profile metrics [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
